# kaioken module plan — generated by `kaioken plan`, EDIT FREELY before
# running `kaioken generate`. Rename modules, adjust scopes, split or merge.
# Scope entries are repo-relative file paths or directory prefixes.
version: 1
modules:
    - id: kaioken
      title: Kaioken AI Coding Assistant
      description: A terminal AI coding assistant and knowledge engine.
      scope:
        - .gitignore
        - Kaioken-settings-logo.json
        - Makefile
        - README.md
        - go.mod
        - go.sum
        - kaioken-logo.txt
        - .claude/settings.local.json
      children:
        - id: chat_agent
          title: Chat Agent
          description: Core chat agent functionality including LLM interaction, skills, and session state.
          scope: []
          children:
            - id: agent_core
              title: Agent Core
              description: Core agent implementation including file operations and command execution.
              scope:
                - internal/agent
            - id: llm_integration
              title: LLM Integration
              description: Integration with various LLM providers (OpenRouter, etc.).
              scope:
                - internal/llm
            - id: agent_skills
              title: Agent Skills
              description: Skill system for the agent to perform tasks.
              scope:
                - internal/skills
                - internal/generate
            - id: agent_state
              title: Agent State
              description: Session and state management for the agent.
              scope:
                - internal/session
                - internal/state
        - id: knowledge_engine
          title: Knowledge Engine
          description: Functionality for scanning repositories and generating knowledge cards.
          scope: []
          children:
            - id: codemap
              title: Code Mapping
              description: Mapping and indexing source code for knowledge generation.
              scope:
                - internal/codemap
            - id: planner
              title: Planner
              description: Planning module for knowledge generation workflow.
              scope:
                - internal/plan
                - internal/scan
            - id: wiki_generator
              title: Wiki Generator
              description: Generates knowledge cards and wiki documentation.
              scope:
                - internal/wiki
            - id: wiki_serve
              title: Wiki Server
              description: Serves the generated wiki via a web interface.
              scope:
                - internal/serve
        - id: tui
          title: Terminal User Interface
          description: Bubble Tea based terminal interface for the application.
          scope:
            - internal/tui
        - id: cmd
          title: Command Entry Point
          description: Main function and command line setup.
          scope:
            - cmd/kaioken
        - id: config
          title: Configuration
          description: Application configuration and global settings.
          scope:
            - internal/config
        - id: gitx
          title: Git Operations
          description: Git repository interaction and hook management.
          scope:
            - internal/gitx
        - id: version
          title: Version Information
          description: Version tracking and build information.
          scope:
            - internal/version
