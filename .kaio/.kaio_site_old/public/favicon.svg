<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ff2a00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boltGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="25%" stop-color="#ffb700"/>
      <stop offset="65%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#d60000"/>
    </linearGradient>
    <linearGradient id="boltGradAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffea75"/>
      <stop offset="100%" stop-color="#ff8700"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0a0a0c"/>

  <!-- Outer Glow Energy Bolt -->
  <path d="M282 44 L138 276 H242 L198 468 L374 236 H270 Z" fill="url(#boltGradMain)" filter="url(#neonGlow)" opacity="0.6"/>

  <!-- Core Energy Bolt -->
  <path d="M282 44 L138 276 H242 L198 468 L374 236 H270 Z" fill="url(#boltGradMain)"/>

  <!-- Inner Highlight Flame / Core -->
  <path d="M276 60 L160 264 H246 L210 420 L350 248 H262 Z" fill="url(#boltGradAccent)" opacity="0.9"/>
</svg>
