name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than pinning: the module requires a newer
          # toolchain than any hard-coded value here stays in sync with.
          go-version-file: kaioken v1/cli/go.mod
          cache-dependency-path: kaioken v1/cli/go.sum
      - name: Check (vet + test)
        working-directory: kaioken v1/cli
        run: make check
      # -race needs cgo and a C toolchain; ubuntu-latest has one. This is the
      # only place it runs — a stock Windows dev box cannot build it.
      - name: Test with -race
        working-directory: kaioken v1/cli
        run: go test ./... -race -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kaioken v1/desktop/package-lock.json
      - name: Install
        working-directory: kaioken v1/desktop
        run: npm ci
      # `tsc --noEmit` on the root config checks nothing: it is a solution file
      # with "files": [], so the real sources are only reached through its
      # project references. -b walks those; --force stops a cached .tsbuildinfo
      # from reporting success without rechecking.
      - name: Typecheck
        working-directory: kaioken v1/desktop
        run: npx tsc -b --force
      - name: Test
        working-directory: kaioken v1/desktop
        run: npm test

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: kaioken v1/cli/go.mod
          cache-dependency-path: kaioken v1/cli/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('kaioken v1/desktop/src-tauri/Cargo.lock') }}
      # tauri-build copies the sidecar into place, so it must exist before the
      # build script runs — clippy still compiles that script even though it
      # never links the final binary.
      - name: Build sidecar
        working-directory: kaioken v1/desktop
        run: node scripts/build-sidecar.mjs
      - name: Clippy
        working-directory: kaioken v1/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  tauri-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kaioken v1/desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than pinning: the module requires a newer
          # toolchain than any hard-coded value here stays in sync with.
          go-version-file: kaioken v1/cli/go.mod
          cache-dependency-path: kaioken v1/cli/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('kaioken v1/desktop/src-tauri/Cargo.lock') }}
      - name: Install frontend deps
        working-directory: kaioken v1/desktop
        run: npm ci
      - name: Build sidecar
        working-directory: kaioken v1/desktop
        run: node scripts/build-sidecar.mjs
      - name: Tauri build
        working-directory: kaioken v1/desktop
        run: npx tauri build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kaioken-desktop-windows
          path: kaioken v1/desktop/src-tauri/target/release/bundle/nsis/*.exe
