name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build the whole pipeline without publishing, so the release
  # config can be smoke-tested without burning a tag.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # keyless cosign signing

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than pinning it here, where it
          # silently drifts behind the toolchain the module actually requires.
          go-version-file: kaioken v1/cli/go.mod
          cache-dependency-path: kaioken v1/cli/go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: kaioken v1
          args: >-
            ${{ startsWith(github.ref, 'refs/tags/v')
                && 'release --clean'
                || 'release --snapshot --clean --skip=publish,sign' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN cannot write to the tap/bucket repositories, so the
          # Homebrew, Scoop and Winget publishers need their own PATs. Leave a
          # secret unset only if you have also removed that publisher from
          # .goreleaser.yaml — goreleaser fails the release otherwise.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      - name: Upload snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist
          path: |
            kaioken v1/dist/*.tar.gz
            kaioken v1/dist/*.zip
            kaioken v1/dist/checksums.txt
          retention-days: 7

  # Independent re-verification of what was actually published: the release
  # job signing its own output proves nothing about the artifacts a user
  # downloads. This pulls them back from the release and checks the signature
  # over checksums.txt, which covers every artifact listed in it.
  verify-signatures:
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Download published checksums and signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'checksums.txt*' --clobber

      - name: Verify cosign signature over checksums.txt
        run: |
          cosign verify-blob \
            --signature checksums.txt.sig \
            --certificate checksums.txt.pem \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
