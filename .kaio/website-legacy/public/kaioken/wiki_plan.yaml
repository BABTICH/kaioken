# kaioken wiki plan — pass 1 of the deep documentation pipeline.
# EDIT FREELY: rename sections, adjust goals/files, add or remove sections,
# then run the wiki again. Delete this file to force a fresh global plan.
version: 1
multiplier: 3
sections:
    - id: getting_started
      title: Getting Started
      goal: Explain how to install, build, and run kaioken for the first time, including basic usage of the TUI and CLI commands.
      files:
        - README.md
        - Makefile
        - go.mod
        - cmd/kaioken/main.go
    - id: architecture_overview
      title: Architecture Overview
      goal: Describe the high-level architecture of kaioken, including its dual nature as a chat agent and knowledge engine, and core components like the TUI, agent, LLM integration, and wiki generation system.
      files:
        - README.md
        - internal/tui/tui.go
        - internal/agent/agent.go
        - internal/wiki/wiki.go
    - id: chat_agent
      title: Chat Agent
      goal: Detail the interactive chat agent's features, including tool usage (read_file, edit_file, run_command), approval workflow, and how it leverages generated knowledge from the wiki.
      files:
        - internal/agent/agent.go
        - internal/agent/tools.go
        - internal/agent/knowledge.go
        - internal/tui/commands.go
        - internal/tui/explain.go
    - id: knowledge_engine
      title: Knowledge Engine
      goal: Explain the process of scanning a repository, planning modules, generating knowledge cards, building a wiki, and updating it over time with incremental changes.
      files:
        - internal/wiki/wiki.go
        - internal/plan/plan.go
        - internal/scan/scan.go
        - internal/state/state.go
        - internal/wiki/passes.go
        - internal/wiki/update.go
    - id: tui
      title: Terminal User Interface (TUI)
      goal: Describe the Bubble Tea-based terminal interface, including the command palette, session management, markdown rendering, built-in tutorial, and status line.
      files:
        - internal/tui/tui.go
        - internal/tui/palette.go
        - internal/tui/session.go
        - internal/tui/markdown.go
        - internal/tui/tutorial.go
        - internal/tui/composer.go
    - id: configuration
      title: Configuration
      goal: Explain how configuration is managed (global, per-repo, and CLI flags), including setting LLM providers, models, API keys, token budgets, and behavior toggles.
      files:
        - internal/config/config.go
        - internal/config/global.go
        - internal/llm/budget.go
        - cmd/kaioken/main.go
    - id: llm_integration
      title: LLM Provider Integration
      goal: Detail how kaioken connects to various LLM providers (OpenRouter, OpenAI, etc.), manages tool use, streams responses, handles token budgets, and implements retry logic.
      files:
        - internal/llm/openrouter.go
        - internal/llm/budget.go
        - internal/llm/stream.go
        - internal/agent/agent.go
    - id: codemap
      title: Code Mapping and Indexing
      goal: Explain how the system parses source code to build symbol indexes, code skeletons, and file maps for use in the knowledge engine and agent's context awareness.
      files:
        - internal/codemap/codemap.go
        - internal/codemap/index.go
        - internal/codemap/bundle.go
        - internal/codemap/parse_go.go
        - internal/codemap/parse_lines.go
    - id: git_integration
      title: Git Integration
      goal: Describe how kaioken interacts with Git repositories to detect changes, generate diffs, apply patches, and install hooks for automatic wiki updates after commits.
      files:
        - internal/gitx/gitx.go
        - internal/gitx/hook.go
        - internal/agent/diff.go
    - id: skills_system
      title: Skills System
      goal: Explain how the system generates and uses task guides (skills) that the agent can load to perform specific tasks, and how to manage and refresh them.
      files:
        - internal/skills/skills.go
        - internal/skills/generate.go
        - internal/skills/skills_test.go
    - id: serving_wiki
      title: Serving the Generated Wiki
      goal: Explain how to serve the generated wiki documentation via a local web browser for easy browsing, navigation, and searching.
      files:
        - internal/serve/serve.go
        - internal/serve/serve_test.go
    - id: development_guide
      title: Development Guide
      goal: Guide contributors on how to run tests, lint, build the project, understand the codebase structure, and make changes.
      files:
        - Makefile
        - internal/*_test.go
        - go.mod
        - .gitignore
