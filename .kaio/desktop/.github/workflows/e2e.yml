name: e2e

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Linux system dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnss3 \
            libasound2 \
            libgbm1 \
            xvfb

      - name: Build Electron app
        run: npm run build

      - name: Run Playwright Electron tests
        run: xvfb-run -a npx playwright test
