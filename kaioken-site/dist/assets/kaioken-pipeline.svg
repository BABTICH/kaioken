<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e121b"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="100%" stop-color="#0f1523"/>
    </linearGradient>
    <linearGradient id="orangeCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#170f0b"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241432"/>
      <stop offset="100%" stop-color="#140c1c"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10251c"/>
      <stop offset="100%" stop-color="#0b1712"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#388bfd"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#ff8700"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#a371f7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#f85149"/>
    </marker>

    <!-- Styles -->
    <style>
      .title { font-family: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace; font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #ff8700; }
      .badge-hud { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #8b949e; letter-spacing: 1px; }
      .sec-hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .node-desc { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; fill: #8b949e; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- Shell Background -->
  <rect width="940" height="560" rx="16" fill="url(#bgGrad)" stroke="#21262d" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="560"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="470" y1="0" x2="470" y2="560"/>
    <line x1="700" y1="0" x2="700" y2="560"/>
    <line x1="900" y1="0" x2="900" y2="560"/>
    <line x1="0" y1="80" x2="940" y2="80"/>
    <line x1="0" y1="220" x2="940" y2="220"/>
    <line x1="0" y1="360" x2="940" y2="360"/>
    <line x1="0" y1="460" x2="940" y2="460"/>
  </g>

  <!-- Header & HUD Frame -->
  <g transform="translate(36, 32)">
    <!-- Corner brackets -->
    <path d="M 0 10 L 0 0 L 10 0" stroke="#ff8700" stroke-width="2" fill="none"/>
    <path d="M 868 10 L 868 0 L 858 0" stroke="#ff8700" stroke-width="2" fill="none"/>
    <circle cx="16" cy="16" r="4" fill="#3fb950"/>
    <text x="28" y="20" class="title">KAIOKEN ENGINE ARCHITECTURE · VERIFIABLE KNOWLEDGE PIPELINE</text>
    <text x="860" y="20" class="badge-hud" text-anchor="end">OFFLINE-FIRST · AST GROUNDED</text>
  </g>

  <!-- ==================== SECTION 1: INGESTION ==================== -->
  <g transform="translate(36, 75)">
    <!-- Container Box -->
    <rect width="868" height="92" rx="10" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="16" y="22" class="sec-hdr" fill="#58a6ff">1. Structural Code Ingestion (100% Offline · No Model Call)</text>

    <!-- Node 1: Target Repository -->
    <g transform="translate(16, 32)">
      <rect width="240" height="48" rx="8" fill="url(#blueCard)" stroke="#388bfd" stroke-width="1.2"/>
      <text x="14" y="20" class="node-title" fill="#ffffff">Target Repository</text>
      <text x="14" y="36" class="node-desc">Source Files (TS, Go, Py, Rust)</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 264 56 L 302 56" stroke="#388bfd" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

    <!-- Node 2: Tree-Sitter AST Engine -->
    <g transform="translate(310, 32)">
      <rect width="250" height="48" rx="8" fill="url(#blueCard)" stroke="#388bfd" stroke-width="1.2"/>
      <text x="14" y="20" class="node-title" fill="#ffffff">Tree-Sitter AST Parser</text>
      <text x="14" y="36" class="node-desc">AST Declaration Queries (.scm)</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 568 56 L 606 56" stroke="#388bfd" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

    <!-- Node 3: Structural Symbol Index -->
    <g transform="translate(614, 32)">
      <rect width="238" height="48" rx="8" fill="url(#blueCard)" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="14" y="20" class="node-title" fill="#ffffff">Symbol &amp; BM25 Index</text>
      <text x="14" y="36" class="node-desc">Declarations + Lexical Store</text>
    </g>
  </g>

  <!-- Fork arrows splitting down to Branch A and Branch B -->
  <path d="M 733 167 L 733 195 L 250 195 L 250 215" stroke="#f0883e" stroke-width="1.8" stroke-dasharray="3 3" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M 733 167 L 733 195 L 690 195 L 690 215" stroke="#a371f7" stroke-width="1.8" stroke-dasharray="3 3" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- ==================== SECTION 2: LEFT BRANCH (GENERATION & VERIFICATION) ==================== -->
  <g transform="translate(36, 218)">
    <rect width="424" height="216" rx="10" fill="#0d1117" stroke="#f0883e" stroke-opacity="0.4" stroke-width="1"/>
    <text x="16" y="22" class="sec-hdr" fill="#ff8700">2A. Grounded Generation &amp; Adversarial Gate</text>

    <!-- Node 4: Grounding Oracle -->
    <g transform="translate(16, 32)">
      <rect width="392" height="44" rx="7" fill="url(#orangeCard)" stroke="#f0883e" stroke-width="1.2"/>
      <text x="14" y="19" class="node-title" fill="#ffffff">Grounding Oracle &amp; Anchor Resolver</text>
      <text x="14" y="33" class="node-desc">Definitive negative guarantee · Line bounds</text>
    </g>

    <!-- Down arrow 4 -> 5 -->
    <path d="M 212 76 L 212 90" stroke="#ff8700" stroke-width="1.6" marker-end="url(#arrowOrange)"/>

    <!-- Node 5: Generative Stages -->
    <g transform="translate(16, 94)">
      <rect width="392" height="44" rx="7" fill="url(#orangeCard)" stroke="#ff8700" stroke-width="1.2"/>
      <text x="14" y="19" class="node-title" fill="#ffffff">Generative Pipeline (LLM Port)</text>
      <text x="14" y="33" class="node-desc">Plan ➔ Knowledge Cards ➔ Deep Wiki (×1 to ×10)</text>
    </g>

    <!-- Down arrow 5 -> 6 -->
    <path d="M 212 138 L 212 152" stroke="#ff8700" stroke-width="1.6" marker-end="url(#arrowOrange)"/>

    <!-- Node 6: Mechanical Verifier & Repair Loop -->
    <g transform="translate(16, 156)">
      <rect width="392" height="46" rx="7" fill="#1c1214" stroke="#f85149" stroke-width="1.4"/>
      <text x="14" y="19" class="node-title" fill="#ff7b72">Mechanical Verifier &amp; Quality Gate</text>
      <text x="14" y="34" class="node-desc">Validates citations, symbols, excerpts · Rejects padding</text>
    </g>
  </g>

  <!-- Adversarial repair loop arrow (curving back from verifier to generative stages) -->
  <path d="M 460 380 Q 485 380 485 330 Q 485 280 460 280" fill="none" stroke="#f85149" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowRed)"/>
  <text x="495" y="333" class="edge-label" fill="#f85149">Adversarial<br/>Repair (×4..10)</text>

  <!-- ==================== SECTION 3: RIGHT BRANCH (PROVENANCE & STALENESS) ==================== -->
  <g transform="translate(480, 218)">
    <rect width="424" height="216" rx="10" fill="#0d1117" stroke="#a371f7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="16" y="22" class="sec-hdr" fill="#d2a8ff">2B. Content-Hash Provenance &amp; Staleness</text>

    <!-- Node 7: Content-Hash Provenance -->
    <g transform="translate(16, 32)">
      <rect width="392" height="44" rx="7" fill="url(#purpleCard)" stroke="#a371f7" stroke-width="1.2"/>
      <text x="14" y="19" class="node-title" fill="#ffffff">Content-Hash Provenance Engine</text>
      <text x="14" y="33" class="node-desc">SHA-256 fingerprint of every source dependency</text>
    </g>

    <!-- Down arrow 7 -> 8 -->
    <path d="M 212 76 L 212 90" stroke="#a371f7" stroke-width="1.6" marker-end="url(#arrowPurple)"/>

    <!-- Node 8: Freshness Drift Gate -->
    <g transform="translate(16, 94)">
      <rect width="392" height="44" rx="7" fill="url(#purpleCard)" stroke="#a371f7" stroke-width="1.2"/>
      <text x="14" y="19" class="node-title" fill="#ffffff">Staleness &amp; Drift Detection (CI Gate)</text>
      <text x="14" y="33" class="node-desc">kaioken status --check (0 model calls · Zero tokens)</text>
    </g>

    <!-- Down arrow 8 -> 9 -->
    <path d="M 212 138 L 212 152" stroke="#a371f7" stroke-width="1.6" marker-end="url(#arrowPurple)"/>

    <!-- Node 9: Incremental Updates -->
    <g transform="translate(16, 156)">
      <rect width="392" height="46" rx="7" fill="url(#purpleCard)" stroke="#a371f7" stroke-width="1.4"/>
      <text x="14" y="19" class="node-title" fill="#d2a8ff">Selective Incremental Refresh</text>
      <text x="14" y="34" class="node-desc">kaioken update revises ONLY invalidated documents</text>
    </g>
  </g>

  <!-- Convergence down to Verified Knowledge Base -->
  <path d="M 248 434 L 248 456 L 440 456" stroke="#3fb950" stroke-width="1.8" fill="none"/>
  <path d="M 692 434 L 692 456 L 500 456" stroke="#3fb950" stroke-width="1.8" fill="none"/>
  <path d="M 470 456 L 470 468" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- ==================== SECTION 4: OUTPUT ARTIFACTS & SURFACES ==================== -->
  <g transform="translate(36, 472)">
    <rect width="868" height="66" rx="10" fill="url(#greenCard)" stroke="#3fb950" stroke-width="1.6"/>

    <!-- Core Store Badge -->
    <g transform="translate(20, 12)">
      <rect width="320" height="42" rx="6" fill="#162a1e" stroke="#2ea043" stroke-width="1"/>
      <text x="14" y="18" class="node-title" fill="#7ee787">.kaioken/ Verified Store</text>
      <text x="14" y="32" class="node-desc">wiki/ · cards/ · skills/ · graph.json</text>
    </g>

    <path d="M 348 33 L 372 33" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

    <!-- Consumption Surfaces -->
    <g transform="translate(380, 15)">
      <!-- Surface 1: TUI -->
      <rect x="0" y="0" width="112" height="36" rx="6" fill="#0f1523" stroke="#388bfd" stroke-width="1"/>
      <text x="56" y="17" class="node-title" font-size="11.5" text-anchor="middle" fill="#58a6ff">Terminal TUI</text>
      <text x="56" y="29" class="node-desc" font-size="9" text-anchor="middle">kaioken-tui</text>

      <!-- Surface 2: CLI -->
      <rect x="122" y="0" width="112" height="36" rx="6" fill="#0f1523" stroke="#388bfd" stroke-width="1"/>
      <text x="178" y="17" class="node-title" font-size="11.5" text-anchor="middle" fill="#58a6ff">CLI Engine</text>
      <text x="178" y="29" class="node-desc" font-size="9" text-anchor="middle">14 Subcommands</text>

      <!-- Surface 3: Local Server -->
      <rect x="244" y="0" width="112" height="36" rx="6" fill="#0f1523" stroke="#388bfd" stroke-width="1"/>
      <text x="300" y="17" class="node-title" font-size="11.5" text-anchor="middle" fill="#58a6ff">Web Server</text>
      <text x="300" y="29" class="node-desc" font-size="9" text-anchor="middle">kaioken serve</text>

      <!-- Surface 4: Agent Loop -->
      <rect x="366" y="0" width="112" height="36" rx="6" fill="#0f1523" stroke="#388bfd" stroke-width="1"/>
      <text x="422" y="17" class="node-title" font-size="11.5" text-anchor="middle" fill="#58a6ff">Agent Tools</text>
      <text x="422" y="29" class="node-desc" font-size="9" text-anchor="middle">symbol/search</text>
    </g>
  </g>
</svg>
