[package]
name = "kaioken"
version = "0.1.0"
edition = "2021"
description = "KAIOKEN Agent - Repo-aware AI coding assistant"

[dependencies]
# CLI & Async
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1.10"

# Database (Ready for Phase 5)
rusqlite = { version = "0.32", features = ["bundled"] }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tempfile = "3.12"

[dev-dependencies]
