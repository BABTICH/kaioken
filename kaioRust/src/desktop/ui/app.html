  <div class="app">
    <header id="titlebar" class="titlebar hud-scanlines" data-drag-region="true">
      <button class="brand titlebar-no-drag" data-action="go-chat" title="Kaioken — Chat">
        <svg class="brand-mark k-pixel-logo" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="1" y="2" width="3" height="12" fill="#ff3b1f"/>
          <rect x="4" y="7" width="2" height="3" fill="#ff3b1f"/>
          <rect x="5" y="5" width="2" height="2" fill="#ff9500"/>
          <rect x="6" y="3" width="2" height="2" fill="#ff9500"/>
          <rect x="7" y="6" width="2" height="2" fill="#ff9500"/>
          <rect x="8" y="8" width="2" height="2" fill="#ff3b1f"/>
          <rect x="9" y="10" width="2" height="2" fill="#ff3b1f"/>
          <rect x="10" y="12" width="3" height="2" fill="#c01500"/>
          <rect x="10" y="2" width="2" height="2" fill="#ff9500"/>
          <rect x="12" y="4" width="2" height="3" fill="#ff3b1f"/>
        </svg>
        <span class="brand-word">kaioken</span>
        <span class="brand-ver">v0.1.0</span>
        <span class="brand-caret animate-caret" aria-hidden="true">▎</span>
      </button>

      <button class="repo-switch titlebar-no-drag" id="repoSwitch" data-action="repo-menu" title="Switch repository">
        <svg class="icon"><use href="#i-folder"/></svg>
        <span class="truncate" id="repoName">kaioRust</span>
        <svg class="icon icon--sm"><use href="#i-chevron-down"/></svg>
      </button>
      <span class="git-meta titlebar-no-drag" title="Git branch and working tree status">
        <svg class="icon"><use href="#i-git-branch"/></svg>
        <span id="branchName">main</span>
        <span class="dirty" id="dirtyCount">·3</span>
      </span>

      <button class="palette-trigger titlebar-no-drag" data-action="open-palette" title="Command palette (Ctrl+K)">
        <svg class="icon icon--sm"><use href="#i-search"/></svg>
        <span class="palette-trigger-text">Search…</span>
        <span class="kbd">Ctrl</span><span class="kbd">K</span>
      </button>

      <span class="titlebar-spacer"></span>

      <span class="power-mini titlebar-no-drag" title="Research multiplier">
        <span>PWR</span>
        <b id="powerMini">×4</b>
      </span>
      <span class="model-badge titlebar-no-drag" id="modelBadge" title="Active model">deepseek-coder</span>

      <div class="window-controls titlebar-no-drag">
        <button class="win-btn" data-action="window-minimize" aria-label="Minimize" title="Minimize">
          <svg class="icon icon--sm"><use href="#i-minus"/></svg>
        </button>
        <button class="win-btn" data-action="window-maximize" aria-label="Maximize or restore" title="Maximize / Restore">
          <svg class="icon icon--sm" id="maximizeIcon"><use href="#i-square"/></svg>
        </button>
        <button class="win-btn win-btn--close" data-action="window-close" aria-label="Close" title="Close">
          <svg class="icon icon--sm"><use href="#i-x"/></svg>
        </button>
      </div>

      <div class="repo-menu" id="repoMenu" hidden></div>
    </header>

    <div class="app-body">
      <nav class="nav-rail" id="navRail" aria-label="Workspace routes"></nav>
      <main class="viewport tech-grid-bg" id="viewport" tabindex="-1"></main>
    </div>

    <footer id="statusbar" class="statusbar hud-scanlines">
      <span class="status-dot" id="connDot" title="Daemon connection"></span>
      <span id="daemonInfo">embedded in-process</span>
      <span class="status-sep"></span>
      <span class="status-task" id="statusTask"></span>
      <span class="status-path truncate" id="statusPath"></span>
      <span class="status-right">
        <span class="status-token" id="tokenMeter" title="Lifetime token usage">
          <svg class="icon"><use href="#i-sigma"/></svg>
          <span>1.6M tokens</span>
        </span>
        <span class="status-sep"></span>
        <button class="status-btn" id="terminalToggle" data-action="toggle-terminal" title="Toggle terminal (Ctrl+`)" aria-label="Toggle terminal">
          <svg class="icon icon--sm"><use href="#i-terminal"/></svg>
        </button>
        <button class="status-btn" id="themeToggle" data-action="toggle-theme" title="Toggle dark / light theme" aria-label="Toggle theme">
          <svg class="icon icon--sm" id="themeIcon"><use href="#i-sun"/></svg>
        </button>
      </span>
    </footer>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script>window.__KAIOKEN_INITIAL_STATE__ = /*__KAIOKEN_INITIAL_STATE__*/;</script>
  <script>/*__KAIOKEN_APP_JS__*/</script>
</body>
</html>
